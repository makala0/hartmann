# Loaded explicitly by integration tests: never use application DB/mail bindings.
spring.datasource.url=jdbc:h2:mem:hartmann-test-${random.uuid};MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
MAIL_SENDER=tests@example.invalid
smtp.email=tests@example.invalid
hartmann.images.source=local
hartmann.images.local.base-path=${java.io.tmpdir}/hartmann-test-images

# Scheduled indexing must not race with transactional test fixtures.
hartmann.classification.enabled=false
